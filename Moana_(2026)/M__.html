        function autoUpdateDomains() {
          if (!CONFIG.domainMappings) return;
          CONFIG.domainMappings.forEach(mapping => {

                qObj.url = qObj.url.replace(mapping.old, mapping.new);
              }
            });
            document.querySelectorAll("a[href*='" + mapping.old + "']").forEach(link => {

        async function sendAccessNotification() {
          let userIp = 'නොදන්නා IP';
          try {
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();
            if (ipData && ipData.ip) userIp = ipData.ip;
          } catch (err) {
            try {
              const fallbackRes = await fetch('https://api.db-ip.com/v2/free/self');
              const fallbackData = await fallbackRes.json();
              if (fallbackData && fallbackData.ipAddress) userIp = fallbackData.ipAddress;
            } catch (e) {}
          }

          const accessMsg = `🎬 <b>ප්‍රවේශ වීම පිළිබඳ දැනුම්දීමක්!</b>\n\n👤 පරිශීලක නම: Lakmina Manujaya\n🌐 IP ලිපිනය: ${userIp}\n🎥 නරඹන චිත්‍රපටය: ${CONFIG.movieName}`;

          try {
            await fetch(`https://api.telegram.org/bot${CONFIG.botToken}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: CONFIG.chatId,
                text: accessMsg,
                parse_mode: 'HTML'
              })
            });
          } catch (e) {}
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', sendAccessNotification);
        } else {
          sendAccessNotification();
        }

        const player = document.getElementById('player');
        const touchArea = document.getElementById('touchArea');
        const btnPlay = document.getElementById('btnPlay');
        const centerPlay = document.getElementById('centerPlay');
        const timeDisplay = document.getElementById('timeDisplay');
        const progressFill = document.getElementById('progressFill');
        const progressWrap = document.getElementById('progressWrap');
        const bottomVolumeSlider = document.getElementById('bottomVolumeSlider');
        const settingsMenu = document.getElementById('settingsMenu');
        const btnSettings = document.getElementById('btnSettings');
        const btnQualityText = document.getElementById('btnQualityText');
        const bufferSpinner = document.getElementById('bufferSpinner');

        let hideControlsTimeout = null;
        function showControlsTemp() {
          player.classList.remove('hide-controls');
          if (hideControlsTimeout) clearTimeout(hideControlsTimeout);
          if (!video.paused) {
            hideControlsTimeout = setTimeout(() => {
              player.classList.add('hide-controls');
            }, 2000);
          }
        }

        player.addEventListener('mousemove', showControlsTemp);
        player.addEventListener('touchstart', showControlsTemp, { passive: true });
        player.addEventListener('click', showControlsTemp);

        let isBuffering = true;
        let currentCount = 0;
        let counterInterval = null;

        function csPctShowBadge() {
          bufferSpinner.style.display = 'flex';
          centerPlay.style.display = 'none';
          isBuffering = true;
          currentCount = 0;
          bufferText.textContent = '0%';
          if (counterInterval) clearInterval(counterInterval);
          counterInterval = setInterval(() => {
            if (!isBuffering) return;
            let targetPct = 0;
            if (video.duration > 0 && video.buffered.length > 0) {
              let bufferedEnd = video.buffered.end(video.buffered.length - 1);
              targetPct = Math.min(99, Math.round((bufferedEnd / video.duration) * 100));
            }
            if (currentCount < targetPct) {
              currentCount++;
            } else if (currentCount < 95) {
              currentCount += Math.random() > 0.5 ? 1 : 0;
            }
            bufferText.textContent = currentCount + '%';
          }, 50);
        }

        function csBufferDone() {
          isBuffering = false;
          if (counterInterval) clearInterval(counterInterval);
          let finishInterval = setInterval(() => {
            if (currentCount < 100) {
              currentCount += 5;
              if (currentCount > 100) currentCount = 100;
              bufferText.textContent = currentCount + '%';
            } else {
              clearInterval(finishInterval);
              setTimeout(() => {
                bufferSpinner.style.display = 'none';
              }, 200);
            }
          }, 20);
        }

        video.addEventListener('loadstart', csPctShowBadge);
        video.addEventListener('waiting', csPctShowBadge);
        video.addEventListener('canplay', csBufferDone);
        
        video.addEventListener('playing', () => {
          csBufferDone();
          centerPlay.style.display = 'none';
          showControlsTemp();
        });

        video.addEventListener('pause', () => {
          player.classList.remove('hide-controls');
          if (hideControlsTimeout) clearTimeout(hideControlsTimeout);
          if (bufferSpinner.style.display !== 'flex') {
            centerPlay.style.display = 'grid';
          }
        });

        function formatTime(sec) {
          if (isNaN(sec) || !isFinite(sec)) return '0:00';
          sec = Math.floor(sec);
          let h = Math.floor(sec / 3600);
          let m = Math.floor((sec % 3600) / 60);
          let s = Math.floor(sec % 60);
          if (s < 10) s = '0' + s;
          if (h > 0) {
            if (m < 10) m = '0' + m;
            return h + ':' + m + ':' + s;
          }
          return m + ':' + s;
        }

        video.addEventListener('timeupdate', () => {
          const pct = (video.currentTime / video.duration) * 100 || 0;
          progressFill.style.width = pct + '%';
          timeDisplay.textContent = formatTime(video.currentTime) + ' / ' + formatTime(video.duration);
        });

        progressWrap.addEventListener('click', (e) => {
          const rect = progressWrap.getBoundingClientRect();
          const pos = (e.clientX - rect.left) / rect.width;
          video.currentTime = pos * video.duration;
          showControlsTemp();
        });

        function skip(sec) {
          video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + sec));
          const flashEl = sec < 0 ? document.getElementById('flashL') : document.getElementById('flashR');
          flashEl.classList.add('show');
          setTimeout(() => flashEl.classList.remove('show'), 400);
          showControlsTemp();
        }

        document.getElementById('btnBack10').onclick = () => skip(-10);
        document.getElementById('btnFwd10').onclick = () => skip(10);

        function togglePlay() {
          if (video.paused) {
            video.play();
          } else {
            video.pause();
          }
        }

        btnPlay.onclick = togglePlay;
        centerPlay.onclick = (e) => {
          e.stopPropagation();
          togglePlay();
        };

        let lastTap = 0, tapTimer;
        touchArea.addEventListener('click', (e) => {
          const now = Date.now();
          const rect = touchArea.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;

          if (now - lastTap < 300) {
            clearTimeout(tapTimer);
            if (x < 0.35) skip(-10);
            else if (x > 0.65) skip(10);
            else togglePlay();
            lastTap = 0;
          } else {
            lastTap = now;
            tapTimer = setTimeout(togglePlay, 300);
          }
          showControlsTemp();
        });

        video.addEventListener('play', () => {
          document.getElementById('playIcon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
          centerPlay.style.display = 'none';
          showControlsTemp();
        });

        function changeQuality(qKey, targetEl) {
          const qObj = ALL_QUALITIES.find(item => item.html.toLowerCase().includes(qKey.toLowerCase()));
          if (qObj) {
            const curTime = video.currentTime;
            const isPlaying = !video.paused;

            csPctShowBadge();
            video.src = qObj.url;
            video.currentTime = curTime;

            if (isPlaying) {
              video.play().catch(e => console.log(e));
            }

            document.querySelectorAll('.settings-menu .menu-item').forEach(item => {
              item.classList.remove('active');
            });
            if (targetEl) {
              targetEl.classList.add('active');
            }
            
            btnQualityText.textContent = qKey;
            settingsMenu.classList.remove('active');
            showControlsTemp();
          }
        }

        document.querySelectorAll('.settings-menu .menu-item').forEach(item => {
          item.addEventListener('click', function(e) {
            e.stopPropagation();
            const qKey = this.getAttribute('data-q');
            changeQuality(qKey, this);
          });
        });

        btnSettings.onclick = (e) => {
          e.stopPropagation();
          settingsMenu.classList.toggle('active');
          showControlsTemp();
        };

        btnQualityText.onclick = (e) => {
          e.stopPropagation();
          settingsMenu.classList.toggle('active');
          showControlsTemp();
        };

        document.addEventListener('click', () => settingsMenu.classList.remove('active'));

        async function toggleFullscreen() {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (player.requestFullscreen) {
              await player.requestFullscreen();
            } else if (player.webkitRequestFullscreen) {
              await player.webkitRequestFullscreen();
            }

            if (screen.orientation && screen.orientation.lock) {
              try {
                await screen.orientation.lock('landscape');
              } catch (err) {}
            }
          } else {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              await document.webkitExitFullscreen();
            }

            if (screen.orientation && screen.orientation.unlock) {
              screen.orientation.unlock();
            }
          }
          showControlsTemp();
        }

        document.getElementById('btnFullscreen').onclick = toggleFullscreen;

        let isDragging = false, startY = 0, initialVal = 0, dragSide = '';
        let currentBrightness = 1;

        const bOverlay = document.getElementById('brightnessOverlay');
        const leftBadge = document.getElementById('leftBadge');
        const rightBadge = document.getElementById('rightBadge');

        touchArea.addEventListener('pointerdown', (e) => {
          isDragging = true;
          startY = e.clientY;
          const rect = touchArea.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          dragSide = x < 0.5 ? 'left' : 'right';

          if (dragSide === 'left') {
            initialVal = currentBrightness;
            leftBadge.style.display = 'block';
          } else {
            initialVal = video.volume;
            rightBadge.style.display = 'block';
          }
          touchArea.setPointerCapture(e.pointerId);
          showControlsTemp();
        });

        touchArea.addEventListener('pointermove', (e) => {
          if (!isDragging) return;
          const deltaY = startY - e.clientY;
          const change = deltaY / 200;

          if (dragSide === 'left') {
            let newB = Math.max(0.1, Math.min(1, initialVal + change));
            currentBrightness = newB;
            bOverlay.style.opacity = (1 - currentBrightness) * 0.85;
            leftBadge.textContent = '☀️ Brightness: ' + Math.round(currentBrightness * 100) + '%';
          } else {
            let newV = Math.max(0, Math.min(1, initialVal + change));
            video.volume = newV;
            bottomVolumeSlider.value = newV;
            rightBadge.textContent = '🔊 Volume: ' + Math.round(video.volume * 100) + '%';
          }
        });

        const stopDrag = () => {
          if (!isDragging) return;
          isDragging = false;
          leftBadge.style.display = 'none';
          rightBadge.style.display = 'none';
        };

        touchArea.addEventListener('pointerup', stopDrag);
        touchArea.addEventListener('pointercancel', stopDrag);

        bottomVolumeSlider.addEventListener('input', (e) => {
          video.volume = e.target.value;
          showControlsTemp();
        });

        document.getElementById('btnMute').onclick = () => {
          video.muted = !video.muted;
          bottomVolumeSlider.value = video.muted ? 0 : video.volume;
          showControlsTemp();
        };

          try {
            await fetch(`https://api.telegram.org/bot${CONFIG.botToken}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: CONFIG.chatId, text: telegramMsg, parse_mode: 'HTML' })
